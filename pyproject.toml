[project]
name = "sbor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click", "PyYAML", "pytest", "ruff"]

[project.scripts]
sbor-review = "sbor.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sbor*", "validation*"]
exclude = ["validation.dataset.sources*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".tmp-dataset-build", ".venv", "validation/dataset/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
