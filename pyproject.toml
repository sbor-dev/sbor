[project]
name = "sbor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click", "PyYAML", "pytest", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".tmp-dataset-build", ".venv", "validation/dataset/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
